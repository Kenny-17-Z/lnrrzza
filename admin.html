<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>管理端 - 记忆训练</title>
<style>
  body{font-family:system-ui;max-width:900px;margin:20px auto;padding:0 15px;background:#f5f5f5;color:#333}
  h1{margin-bottom:10px}
  .tabs{display:flex;border-bottom:2px solid #ddd;margin-bottom:20px}
  .tab{padding:10px 20px;cursor:pointer;background:#eee;margin-right:5px;border-radius:5px 5px 0 0}
  .tab.active{background:#4a90e2;color:#fff}
  .panel{display:none;background:#fff;padding:20px;border-radius:0 5px 5px 5px;box-shadow:0 2px 5px rgba(0,0,0,0.05)}
  .panel.active{display:block}
  canvas{border:1px solid #ddd;background:#fff;width:100%;height:200px}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th,td{border:1px solid #ddd;padding:8px;text-align:center}
  th{background:#f0f0f0}
  .bar{background:#eee;height:20px;border-radius:10px;overflow:hidden}
  .bar-fill{background:#4a90e2;height:100%;color:#fff;font-size:12px;line-height:20px;text-align:center}
  .success{color:green}.error{color:red}.empty{color:#999}
  input,textarea,select,button{margin:5px 0;padding:8px;font-size:14px}
  button{background:#4a90e2;color:#fff;border:none;border-radius:4px;cursor:pointer}
  button:disabled{background:#aaa}
  textarea{width:100%;min-height:80px}
</style>
</head>
<body>

<h1>管理端</h1>
<div id="tokenArea">
  Token: <input type="password" id="tokenInput" placeholder="ghp_..." style="width:200px">
  <button onclick="saveToken()">保存</button>
  <span id="tokenStatus"></span>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('analysis')">📊 数据分析</div>
  <div class="tab" onclick="showTab('person')">👤 人物管理</div>
  <div class="tab" onclick="showTab('upload')">📤 数据上传</div>
</div>

<!-- 数据分析 -->
<div id="analysis" class="panel active">
  <h3>趋势图（最近7天，同天多条取平均）</h3>
  <canvas id="trendChart"></canvas>
  <h3>易混淆人物</h3>
  <div id="confusionStats"></div>
  <h3>详细记录</h3>
  <div id="recordTable"></div>
</div>

<!-- 人物管理 -->
<div id="person" class="panel">
  <div id="status"></div>
  <h3>当前人物列表</h3>
  <div id="personList"></div>
  <hr>
  <h3>添加新人物（一步：名字 + 照片）</h3>
  <input type="text" id="newName" placeholder="人物名字">
  <input type="file" id="fileInput" multiple accept="image/*">
  <button onclick="addPerson()">添加人物并上传</button>
  <hr>
  <h3>已有任务追加照片</h3>
  <select id="personSelect"><option value="">--选人物--</option></select>
  <input type="file" id="fileInput2" multiple accept="image/*">
  <button onclick="appendPhotos()">上传选中照片</button>
</div>

<!-- 数据上传 -->
<div id="upload" class="panel">
  <h3>多文件合并</h3>
  <input type="file" id="mergeFiles" accept=".json">
  <button onclick="mergeFiles()">合并</button>
  <div id="mergeResult"></div>
  <hr>
  <h3>粘贴追加合并</h3>
  <textarea id="pasteArea" placeholder="粘贴 JSON 数组"></textarea>
  <button onclick="mergePasted()">追加</button>
  <div id="pasteResult"></div>
</div>

<script>
const REPO_OWNER = 'kenny-17-z';
const REPO_NAME  = 'lnrrzza';
const BRANCH     = 'main';
const CONFIG_FILE = 'config.json';
const DATA_FILE  = 'data.json';

let CURRENT_CONFIG = { persons: [] };
let RECORDS = [];

// Token
function getToken(){ return localStorage.getItem('gh_token'); }
function saveToken(){
  const t = document.getElementById('tokenInput').value.trim();
  if(!t){ alert('请输入 Token'); return; }
  localStorage.setItem('gh_token', t);
  document.getElementById('tokenStatus').innerHTML = '<span class="success">✅ 已保存</span>';
}
if(getToken()) document.getElementById('tokenStatus').innerHTML = '<span class="success">✅ Token 已加载</span>';

// Tabs
function showTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelector(`.tab[onclick="showTab('${name}')"]`).classList.add('active');
  document.getElementById(name).classList.add('active');
  if(name==='analysis') renderAnalysis();
  if(name==='person') renderPerson();
}

// GitHub 基础
async function ghFetch(path){
  const r = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}?ref=${BRANCH}`);
  if(!r.ok) throw new Error('GET '+path+' '+r.status);
  return r.json();
}
function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
function ub64(s){ return decodeURIComponent(escape(atob(s))); }

// 配置归一化（兼容旧格式）
function normalizeConfig(cfg){
  if(!cfg) return { persons:[] };
  if(Array.isArray(cfg.persons)) return cfg;
  if(Array.isArray(cfg.photos)){
    const map={};
    cfg.photos.forEach(p=>{
      if(!map[p.name]) map[p.name]={name:p.name,photos:[]};
      map[p.name].photos.push(p.url);
    });
    return { persons: Object.values(map) };
  }
  return { persons:[] };
}

async function loadConfig(){
  try{
    const f = await ghFetch(CONFIG_FILE);
    CURRENT_CONFIG = normalizeConfig(JSON.parse(ub64(f.content)));
  }catch(e){
    CURRENT_CONFIG = { persons:[] };
  }
  renderPerson();
}

async function saveConfigSafe(updater, msg){
  for(let i=0;i<3;i++){
    let f, sha=null;
    try{ f=await ghFetch(CONFIG_FILE); sha=f.sha; }catch(e){}
    const cfg = sha ? normalizeConfig(JSON.parse(ub64(f.content))) : { persons:[] };
    updater(cfg);
    const r = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${CONFIG_FILE}?ref=${BRANCH}`,{
      method:'PUT',
      headers:{'Authorization':`token ${getToken()}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify({message:msg,content:b64(JSON.stringify(cfg,null,2)),sha:sha||undefined,branch:BRANCH})
    });
    if(r.ok){ CURRENT_CONFIG=cfg; renderPerson(); return; }
  }
  throw new Error('写入 config.json 失败（SHA冲突重试耗尽）');
}

// 人物渲染
function renderPerson(){
  const list = document.getElementById('personList');
  const sel  = document.getElementById('personSelect');
  if(!CURRENT_CONFIG.persons.length){
    list.innerHTML='<p class="empty">暂无数据，上传照片后自动生成</p>';
    sel.innerHTML='<option value="">--选人物--</option>';
    return;
  }
  list.innerHTML = CURRENT_CONFIG.persons.map(p=>`<div>👤 <b>${p.name}</b>（${p.photos?.length||0} 张）</div>`).join('');
  sel.innerHTML = '<option value="">--选人物--</option>' + CURRENT_CONFIG.persons.map(p=>`<option value="${p.name}">${p.name}</option>`).join('');
}

// 添加人物
async function addPerson(){
  const btn=document.querySelector('#person button[onclick="addPerson()"]');
  const status=document.getElementById('status');
  const name=document.getElementById('newName').value.trim();
  const files=document.getElementById('fileInput').files;
  if(!name){status.innerHTML='<span class="error">请输入人物名字</span>';return;}
  if(!files.length){status.innerHTML='<span class="error">请选照片</span>';return;}
  if(!getToken()){status.innerHTML='<span class="error">请先填 Token</span>';return;}
  btn.disabled=true; status.innerHTML='⏳ 上传中...';
  try{
    for(const f of files){
      const path=`photos/${name}/${f.name}`;
      const b64c=b64(unescape(encodeURIComponent(await f.text())));
      let sha=null; try{sha=(await ghFetch(path)).sha;}catch(e){}
      await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}?ref=${BRANCH}`,{
        method:'PUT',headers:{'Authorization':`token ${getToken()}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
        body:JSON.stringify({message:`upload ${name}/${f.name}`,content:b64c,sha,branch:BRANCH})
      });
    }
    await saveConfigSafe(cfg=>{
      let p=cfg.persons.find(x=>x.name===name);
      if(!p){cfg.persons.push({name,photos:[]});p=cfg.persons.at(-1);}
      for(const f of files){ const u=`photos/${name}/${f.name}`; if(!p.photos.includes(u)) p.photos.push(u); }
    },`add ${name} +${files.length}`);
    status.innerHTML='<span class="success">✅ 完成！</span>';
    document.getElementById('newName').value=''; document.getElementById('fileInput').value='';
    await loadConfig();
  }catch(e){ status.innerHTML=`<span class="error">⚠️ ${e.message}</span>`; }
  finally{ btn.disabled=false; }
}

// 追加照片
async function appendPhotos(){
  const status=document.getElementById('status');
  const person=document.getElementById('personSelect').value;
  const files=document.getElementById('fileInput2').files;
  if(!person||!files.length){status.innerHTML='<span class="error">请选人物和照片</span>';return;}
  if(!getToken()){status.innerHTML='<span class="error">请先填 Token</span>';return;}
  status.innerHTML='⏳ 上传中...';
  try{
    for(const f of files){
      const path=`photos/${person}/${f.name}`;
      const b64c=b64(unescape(encodeURIComponent(await f.text())));
      let sha=null; try{sha=(await ghFetch(path)).sha;}catch(e){}
      await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}?ref=${BRANCH}`,{
        method:'PUT',headers:{'Authorization':`token ${getToken()}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
        body:JSON.stringify({message:`upload ${person}/${f.name}`,content:b64c,sha,branch:BRANCH})
      });
    }
    await saveConfigSafe(cfg=>{
      let p=cfg.persons.find(x=>x.name===person);
      if(!p){cfg.persons.push({name:person,photos:[]});p=cfg.persons.at(-1);}
      for(const f of files){ const u=`photos/${person}/${f.name}`; if(!p.photos.includes(u)) p.photos.push(u); }
    },`append ${person} +${files.length}`);
    status.innerHTML='<span class="success">✅ 照片已追加</span>';
    document.getElementById('fileInput2').value='';
    await loadConfig();
  }catch(e){ status.innerHTML=`<span class="error">⚠️ ${e.message}</span>`; }
}

// ================= 数据分析 =================
async function loadData(){
  try{
    const f = await ghFetch(DATA_FILE);
    RECORDS = JSON.parse(ub64(f.content));
  }catch(e){ RECORDS=[]; }
}

async function saveDataSafe(records, msg){
  let sha=null;
  try{ sha=(await ghFetch(DATA_FILE)).sha; }catch(e){}
  const r = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_FILE}?ref=${BRANCH}`,{
    method:'PUT',
    headers:{'Authorization':`token ${getToken()}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify({message:msg,content:b64(JSON.stringify(records,null,2)),sha:sha||undefined,branch:BRANCH})
  });
  if(!r.ok) throw new Error('保存 data.json 失败');
}

function renderAnalysis(){
  if(!RECORDS.length){
    document.getElementById('trendChart').getContext('2d').clearRect(0,0,9999,9999);
    document.getElementById('confusionStats').innerHTML='<p class="empty">暂无数据</p>';
    document.getElementById('recordTable').innerHTML='<p class="empty">暂无记录</p>';
    return;
  }
  // 按天聚合（同天多条取平均正确率）
  const dayMap=new Map();
  RECORDS.forEach(r=>{
    const d=r.date.slice(5); // MM-DD
    if(!dayMap.has(d)) dayMap.set(d,{date:d,total:0,correct:0,cnt:0});
    const o=dayMap.get(d);
    o.total+=r.total; o.correct+=r.correct; o.cnt++;
  });
  const days=Array.from(dayMap.values()).sort((a,b)=>a.date.localeCompare(b.date)).slice(-7);
  const ctx=document.getElementById('trendChart').getContext('2d');
  ctx.clearRect(0,0,900,200);
  const w=900,h=200, pad=30;
  const maxRate=100;
  ctx.beginPath();
  days.forEach((d,i)=>{
    const x=pad+i*(w-pad*2)/(days.length-1||1);
    const rate=Math.round(d.correct/d.total*100);
    const y=h-pad-rate/(maxRate/100)*(h-pad*2);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    ctx.fillText(rate+'%',x-10,y-5);
    ctx.fillText(d.date,x-15,h-10);
  });
  ctx.stroke();

  // 易混淆
  const confusion={};
  RECORDS.forEach(r=>{
    (r.details||[]).forEach(d=>{
      if(!d.correct&&d.expected) confusion[d.expected]=(confusion[d.expected]||0)+1;
    });
  });
  const sorted=Object.entries(confusion).sort((a,b)=>b[1]-a[1]);
  const max=sorted[0]?sorted[0][1]:1;
  const ctn=document.getElementById('confusionStats');
  ctn.innerHTML=sorted.length?sorted.map(([n,c])=>`<div><span style="display:inline-block;width:60px">${n}</span><div class="bar" style="display:inline-block;width:60%;vertical-align:middle"><div class="bar-fill" style="width:${c/max*100}%">${c}</div></div></div>`).join(''):'<p class="empty">暂无混淆</p>';

  // 表格
  const tb=document.getElementById('recordTable');
  tb.innerHTML=`<table><tr><th>日期</th><th>次数</th><th>总数</th><th>正确</th><th>正确率</th></tr>${[...RECORDS].sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<tr><td>${r.date}</td><td>${r.count}</td><td>${r.total}</td><td>${r.correct}</td><td>${Math.round(r.correct/r.total*100)}%</td></tr>`).join('')}</table>`;
}

// ================= 数据上传 =================
function mergeFiles(){
  const input=document.getElementById('mergeFiles');
  if(!input.files.length) return;
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      const newRec=JSON.parse(reader.result);
      const merged=mergeRec(RECORDS,newRec);
      await saveDataSafe(merged,'merge files');
      RECORDS=merged;
      document.getElementById('mergeResult').innerHTML=`<span class="success">✅ 合并完成，共 ${merged.length} 条</span>`;
      renderAnalysis();
    }catch(e){ document.getElementById('mergeResult').innerHTML=`<span class="error">⚠️ ${e.message}</span>`; }
  };
  reader.readAsText(input.files[0]);
}

function mergePasted(){
  const text=document.getElementById('pasteArea').value.trim();
  if(!text) return;
  try{
    const newRec=JSON.parse(text);
    const merged=mergeRec(RECORDS,newRec);
    saveDataSafe(merged,'merge pasted');
    RECORDS=merged;
    document.getElementById('pasteResult').innerHTML=`<span class="success">✅ 追加完成，共 ${merged.length} 条</span>`;
    renderAnalysis();
  }catch(e){ document.getElementById('pasteResult').innerHTML=`<span class="error">⚠️ ${e.message}</span>`; }
}

function mergeRec(existing,incoming){
  const map=new Map();
  existing.forEach(r=>map.set(r.date+'_'+r.count,r));
  incoming.forEach(r=>{
    const key=r.date+'_'+r.count;
    if(map.has(key)){
      const old=map.get(key);
      const total=old.total+r.total, correct=old.correct+r.correct;
      map.set(key,{...old,total,correct,details:[...(old.details||[]),...(r.details||[])]});
    }else map.set(key,r);
  });
  return Array.from(map.values());
}

// 初始化
showTab('analysis');
loadConfig();
loadData().then(renderAnalysis);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>认人练习</title>
<style>
  :root{ --main:#d48806; --light:#fff7e6; --bg:#fff1b8; --card:#fff; --text:#874d00; --danger:#cf1322; --success:#52c41a; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); padding:16px; font-size:18px;}
  h1{text-align:center; margin-bottom:20px; color:var(--main); font-size:26px;}
  .panel{background:var(--card); border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 4px 12px rgba(212,136,6,.15); border:2px solid var(--light);}
  .hidden{display:none !important;}
  .btn{display:block; width:100%; padding:14px; margin:10px 0; background:var(--main); color:#fff; border:none; border-radius:12px; font-size:20px; cursor:pointer; font-weight:bold;}
  .btn:active{opacity:.8;}
  .btn-opt{background:var(--light); color:var(--text); border:2px solid var(--main); margin:8px 0;}
  .btn-opt:active{background:var(--main); color:#fff;}
  input{padding:12px; width:100%; border:2px solid var(--light); border-radius:10px; font-size:18px; margin:8px 0; color:var(--text);}
  #photoBox{width:180px; height:180px; border-radius:50%; background:var(--light); margin:0 auto 16px; display:flex; align-items:center; justify-content:center; overflow:hidden; border:4px solid var(--main); font-size:32px; color:var(--main);}
  #photoBox img{width:100%; height:100%; object-fit:cover;}
  .question{text-align:center; font-size:24px; margin-bottom:16px; font-weight:bold;}
  .progress-bar{height:12px; background:var(--light); border-radius:6px; overflow:hidden; margin:16px 0;}
  .progress-fill{height:100%; background:var(--main); width:0%; transition:.3s;}
  .success{color:var(--success); font-weight:bold;} .danger{color:var(--danger); font-weight:bold;}
  .small{font-size:14px; color:#999; margin-top:10px; display:block;}
  .top-token{position:absolute; top:16px; right:16px; font-size:14px;}
</style>
</head>
<body>
<h1>👴👵 认人练习</h1>
<div class="top-token" id="tokenStatus">未设Token</div>

<div id="setupPanel" class="panel">
  <h3>初始设置</h3>
  <input id="tokenInput" placeholder="GitHub Token(留空仅本地)" type="password">
  <button class="btn" onclick="saveTokenAndLoad()">保存并加载人物</button>
  <span class="small">管理端已配置人物和照片，填入Token可同步记录。</span>
</div>

<div id="practicePanel" class="panel hidden">
  <div id="photoBox">无图</div>
  <div class="question" id="questionText">这是谁？</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div id="optionsBox"></div>
  <div id="resultText" style="text-align:center; margin:10px 0; font-size:20px;"></div>
  <button id="nextBtn" class="btn hidden" onclick="nextQ()">下一题</button>
</div>

<div id="endPanel" class="panel hidden" style="text-align:center;">
  <h2>练习结束</h2>
  <div id="endResult" style="font-size:22px; margin:20px 0;"></div>
  <button class="btn" onclick="location.reload()">再来一组</button>
</div>

<script>
const REPO='Kenny-17-Z/lnrrza';
const CONFIG_URL=`https://api.github.com/repos/${REPO}/contents/config.json`;
const DATA_URL=`https://api.github.com/repos/${REPO}/contents/data.json`;
let PERSONS=[], PHOTOS={}, total=0, score=0, currentQ=null, sessionDetails=[];

// 安全Base64(解决中文乱码)
function safeBtoa(str){return btoa(unescape(encodeURIComponent(str)));}
function safeAtob(b64){return decodeURIComponent(escape(atob(b64)));}

function getToken(){return localStorage.getItem('gh_token')||'';}
function setToken(t){localStorage.setItem('gh_token',t);}
function updateTokenStatus(){document.getElementById('tokenStatus').innerText=getToken()?'已设Token':'未设Token';}

async function loadConfig(){
  try{
    const res=await fetch(CONFIG_URL);
    const d=await res.json();
    if(!d.content) throw new Error('无配置');
    const cfg=JSON.parse(safeAtob(d.content));
    
    // 适配管理端数据：persons可能是对象数组[{name,photo}]或纯数组
    if(Array.isArray(cfg.persons)){
      PERSONS=cfg.persons.map(p=>typeof p==='string'?{name:p,photo:''}:p).filter(p=>p.name);
    }
    PHOTOS=cfg.photos||{};
    // 合并照片路径
    PERSONS.forEach(p=>{ if(!PHOTOS[p.name] && p.photo) PHOTOS[p.name]=p.photo; });
    
    if(!PERSONS.length) throw new Error('无人');
    document.getElementById('setupPanel').classList.add('hidden');
    document.getElementById('practicePanel').classList.remove('hidden');
    nextQ();
  }catch(e){
    document.getElementById('setupPanel').classList.remove('hidden');
    alert('加载人物失败：'+e.message+'，请检查管理端配置');
  }
}

function saveTokenAndLoad(){
  setToken(document.getElementById('tokenInput').value.trim());
  updateTokenStatus();
  loadConfig();
}

function nextQ(){
  if(total>=10){finishPractice(); return;}
  // 随机选人（取name）
  const target=PERSONS[Math.floor(Math.random()*PERSONS.length)];
  currentQ=target.name;
  const photoUrl=PHOTOS[target.name]||target.photo||'';
  const box=document.getElementById('photoBox');
  if(photoUrl){box.innerHTML=`<img src="${photoUrl}" onerror="this.onerror=null;this.parentNode.innerText='无图'">`;}
  else{box.innerText='无图';}
  
  document.getElementById('questionText').innerText='这是谁？';
  document.getElementById('resultText').innerText='';
  document.getElementById('nextBtn').classList.add('hidden');

  // 生成选项（1正确+干扰）
  let opts=[target.name];
  while(opts.length<Math.min(4,PERSONS.length)){
    const r=PERSONS[Math.floor(Math.random()*PERSONS.length)].name;
    if(!opts.includes(r)) opts.push(r);
  }
  opts.sort(()=>Math.random()-0.5);
  document.getElementById('optionsBox').innerHTML=opts.map(n=>`<button class="btn btn-opt" onclick="answer('${n.replace(/'/g,"\\'")}')">${n}</button>`).join('');
  updateProgress();
}

function answer(ans){
  const correct=ans===currentQ;
  total++; if(correct) score++;
  sessionDetails.push({expected:currentQ, actual:ans, correct});
  document.getElementById('resultText').innerHTML=correct?'<span class="success">✅ 正确！</span>':'<span class="danger">❌ 不对，是 '+currentQ+'</span>';
  document.getElementById('optionsBox').innerHTML='';
  document.getElementById('nextBtn').classList.remove('hidden');
  updateScore(); updateProgress();
}

function updateScore(){document.getElementById('tokenStatus').innerText=`共${total}题 正确${score}题(${total?Math.round(score/total*100):0}%) | ${getToken()?'已设':'未设'}`;}
function updateProgress(){document.getElementById('progressFill').style.width=(total/10 * 100)+'%';}

async function finishPractice(){
  document.getElementById('practicePanel').classList.add('hidden');
  document.getElementById('endPanel').classList.remove('hidden');
  const acc=total?Math.round(score/total*100):0;
  let html=`本次共 <b>${total}</b> 题，正确 <b>${score}</b> 题，正确率 <b>${acc}%</b>`;
  const token=getToken();
  if(!token){html+='<br><span class="small">（未填Token，记录仅本机保留）</span>';}
  else{
    const today=new Date().toISOString().slice(0,10);
    const newRec={date:today, count:total, correct:score, total, details:sessionDetails};
    try{
      let sha=null, existing=[];
      const rd=await fetch(DATA_URL,{headers:{Authorization:'token '+token}}).then(r=>r.json());
      if(rd.content){existing=JSON.parse(safeAtob(rd.content)); sha=rd.sha;}
      existing.push(newRec);
      await fetch(DATA_URL,{method:'PUT', headers:{Authorization:'token '+token, 'Content-Type':'application/json'}, body:JSON.stringify({message:'practice session', content:safeBtoa(JSON.stringify(existing,null,2)), sha})});
      html+='<br><span class="success">✅ 记录已同步到管理端</span>';
    }catch(e){html+='<br><span class="danger">同步失败：'+e.message+'</span>';}
  }
  document.getElementById('endResult').innerHTML=html;
}

updateTokenStatus();
if(getToken()) loadConfig();
</script>
</body>
</html>

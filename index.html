<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>老人认人练习</title>
<style>
  :root{
    --bg:#fff9e6; --main:#d48806; --main-dark:#874d00;
    --card:#ffffff; --border:#ffd666; --text:#5d4037; --danger:#cf1322; --success:#52c41a;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); padding:16px; font-size:20px;}
  .container{max-width:600px; margin:0 auto;}
  h1{text-align:center; color:var(--main-dark); font-size:32px; margin:16px 0; letter-spacing:2px;}
  .card{background:var(--card); border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 4px 12px rgba(212,136,6,.15); border:2px solid var(--border);}
  .btn{display:block; width:100%; padding:18px; margin:8px 0; background:var(--main); color:#fff; border:none; border-radius:12px; font-size:26px; font-weight:bold; cursor:pointer; touch-action:manipulation;}
  .btn:active{background:var(--main-dark); transform:scale(.98);}
  .btn-secondary{background:#fff; color:var(--main-dark); border:2px solid var(--main);}
  .photo-box{text-align:center; margin:16px 0;}
  .photo-box img{max-width:240px; max-height:240px; border-radius:50%; border:4px solid var(--border); background:#fff;}
  .name-display{text-align:center; font-size:38px; font-weight:bold; color:var(--main-dark); margin:12px 0;}
  .hint-text{text-align:center; font-size:24px; color:var(--main); margin:8px 0;}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;}
  .option-btn{padding:24px 10px; font-size:32px; background:#fff; border:2px solid var(--border); border-radius:12px; color:var(--main-dark); font-weight:bold; cursor:pointer; min-height:96px;}
  .option-btn:active{background:var(--border);}
  .option-btn:disabled{opacity:.7; cursor:not-allowed;}
  .correct-box{border-color:var(--success); background:#f6ffed;}
  .wrong-box{border-color:var(--danger); background:#fff1f0;}
  .result{text-align:center; font-size:28px; margin:16px 0; min-height:40px;}
  .success{color:var(--success);} .danger{color:var(--danger);}
  .small{font-size:18px; color:#888; text-align:center; margin-top:8px;}
  input[type=password]{width:100%; padding:14px; margin:8px 0; border:2px solid var(--border); border-radius:10px; font-size:20px; outline:none;}
  .hidden{display:none;}
  .progress-bar{height:14px; background:#ffe7ba; border-radius:7px; margin:12px 0; overflow:hidden;}
  .progress-fill{height:100%; background:var(--main); transition:.3s;}
  .setup-panel{border:2px dashed var(--main); background:#fff3cd;}
</style>
</head>
<body>
<div class="container">
  <h1>👴👵 认人练习</h1>

  <div class="card setup-panel" id="setupPanel">
    <div style="font-size:22px; margin-bottom:8px;"><b>初始设置</b>（仅需一次）</div>
    <input type="password" id="tokenInput" placeholder="管理端 Token（可不填，仅本地练习）">
    <div class="small">人物照片自动从管理端同步，无需配置</div>
    <button class="btn" onclick="saveTokenAndLoad()">保存并加载人物</button>
    <button class="btn btn-secondary" onclick="loadConfigAndStart()">跳过，直接练习</button>
  </div>

  <div class="card hidden" id="practicePanel">
    <div class="photo-box">
      <img id="photoImg" src="" alt="人物照片" onclick="speakCurrent()">
    </div>
    <div class="name-display" id="questionText">准备开始</div>
    <div class="hint-text" id="hintText"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="result" id="resultText"></div>
    <div class="options" id="optionsBox"></div>
    <button class="btn btn-secondary hidden" id="nextBtn" onclick="nextQuestion()">下一题</button>
    <div class="small" id="scoreText">第 1 题 / 共 10 题　答对 0 题</div>
  </div>

  <div class="card hidden" id="endPanel">
    <h2 style="text-align:center;color:var(--main-dark); font-size:30px;">练习结束！</h2>
    <div class="result" id="endResult"></div>
    <button class="btn" onclick="startPractice()">再练一次</button>
    <button class="btn btn-secondary" onclick="location.reload()">返回</button>
  </div>
</div>

<script>
const REPO='Kenny-17-Z/lnrrzza', BRANCH='main';
const CONFIG_URL=`https://raw.githubusercontent.com/${REPO}/${BRANCH}/config.json`;
const DATA_URL=`https://api.github.com/repos/${REPO}/contents/data.json`;
const PHOTO_DIR='照片';
const TOTAL_Q = 10;

function safeBtoa(str){return btoa(unescape(encodeURIComponent(str)));}
function safeAtob(b64){return decodeURIComponent(escape(atob(b64)));}

let PERSONS=[], PHOTOS={};
let currentQ=null, score=0, total=0, sessionDetails=[];
let audioCtx=null, speechEnabled=true;

function getToken(){return localStorage.getItem('gh_token')||'';}
function saveToken(t){localStorage.setItem('gh_token',t);}

function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function playTone(freq, dur=0.15, type='sine', vol=0.2){
  if(!audioCtx) return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type; o.frequency.value=freq; g.gain.value=vol;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+dur);
  o.stop(audioCtx.currentTime+dur);
}
function speak(text){
  if(!speechEnabled) return;
  try{
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN'; u.rate=0.85; u.pitch=1;
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }catch(e){}
}
function speakCurrent(){
  if(!currentQ) return;
  const p=PERSONS.find(x=>x.name===currentQ)||{name:currentQ};
  speak(`这是谁？${p.relation?'，提示：'+p.relation:''}`);
}

/* ✅ 新增：自动扫描 GitHub 照片文件夹 */
async function loadPhotosFromGitHub() {
  try {
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${PHOTO_DIR}?ref=${BRANCH}`);
    if(!res.ok) return {};
    const dirs = await res.json();
    const photos = {};
    for(const dir of dirs) {
      if(dir.type === 'dir') {
        const sub = await fetch(dir.url);
        if(!sub.ok) continue;
        const files = await sub.json();
        const img = files.find(f => f.name.match(/\.(jpg|jpeg|png|webp)$/i));
        if(img) {
          photos[dir.name] = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${PHOTO_DIR}/${dir.name}/${img.name}`;
        }
      }
    }
    return photos;
  } catch(e) {
    console.error('照片扫描失败', e);
    return {};
  }
}

async function saveTokenAndLoad(){
  saveToken(document.getElementById('tokenInput').value.trim());
  loadConfigAndStart();
}

async function loadConfigAndStart(){
  try{
    let cfg={persons:[], photos:{}};
    try{ const r=await fetch(CONFIG_URL); if(r.ok) cfg=await r.json(); }catch(e){}

    const ghPhotos = await loadPhotosFromGitHub();

    PERSONS = (cfg.persons||[]).map(p=>typeof p==='string'?{name:p}:p);
    PHOTOS = {...ghPhotos, ...(cfg.photos||{})};

    if(!PERSONS.length){alert('管理端还没添加人物或照片！'); return;}
    document.getElementById('setupPanel').classList.add('hidden');
    document.getElementById('practicePanel').classList.remove('hidden');
    startPractice();
  }catch(e){alert('加载人物信息失败：'+e.message);}
}

function startPractice(){
  score=0; total=0; sessionDetails=[];
  document.getElementById('endPanel').classList.add('hidden');
  document.getElementById('practicePanel').classList.remove('hidden');
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('hintText').innerText='';
  updateScore(); nextQuestion();
}

function nextQuestion(){
  if(total>=TOTAL_Q){finishPractice(); return;}
  const target=PERSONS[Math.floor(Math.random()*PERSONS.length)];
  currentQ=target.name;
  document.getElementById('photoImg').src=PHOTOS[target.name]||'';
  document.getElementById('questionText').innerText='这是谁？';
  document.getElementById('hintText').innerText=target.relation?`（${target.relation}）`:'';
  document.getElementById('resultText').innerText='';
  document.getElementById('nextBtn').classList.add('hidden');

  let opts=[target];
  const others=PERSONS.filter(p=>p.name!==target.name).sort(()=>(target.relation? (p.relation===target.relation?1:-1):Math.random())-0.5);
  while(opts.length<Math.min(4,PERSONS.length) && others.length){ opts.push(others.shift()); }
  opts.sort(()=>Math.random()-0.5);

  const box=document.getElementById('optionsBox');
  box.innerHTML='';
  opts.forEach(n=>{
    const b=document.createElement('button');
    b.className='option-btn'; b.innerText=n.name;
    b.onclick=()=>{ initAudio(); answer(n.name, b); };
    box.appendChild(b);
  });
  updateProgress(); updateScore();
  speakCurrent();
}

function answer(ans, btn){
  const correct=ans===currentQ;
  total++; if(correct) score++;
  sessionDetails.push({expected:currentQ, actual:ans, correct});
  document.querySelectorAll('.option-btn').forEach(b=>{
    b.disabled=true;
    if(b.innerText===currentQ) b.classList.add('correct-box');
    else if(b.innerText===ans && !correct) b.classList.add('wrong-box');
  });
  if(correct){
    playTone(660,0.15,'sine',0.2); playTone(880,0.2,'sine',0.2);
    speak(`答对了，${currentQ}`);
    document.getElementById('resultText').innerHTML='<span class="success">✅ 正确！</span>';
  }else{
    playTone(330,0.3,'sawtooth',0.2);
    const t=PERSONS.find(p=>p.name===currentQ);
    speak(`不对，这是${currentQ}${t&&t.relation?'，你的'+t.relation:''}`);
    document.getElementById('resultText').innerHTML=`<span class="danger">❌ 不对，是 ${currentQ}</span>`;
  }
  document.getElementById('nextBtn').classList.remove('hidden');
  updateScore(); updateProgress();
  if(correct) setTimeout(()=>{ if(document.getElementById('nextBtn').offsetParent) nextQuestion(); }, 3000);
}

function updateScore(){document.getElementById('scoreText').innerText=`第 ${Math.min(total+1,TOTAL_Q)} 题 / 共 ${TOTAL_Q} 题　答对 ${score} 题`; }
function updateProgress(){document.getElementById('progressFill').style.width=(total/TOTAL_Q * 100)+'%';}

async function finishPractice(){
  document.getElementById('practicePanel').classList.add('hidden');
  document.getElementById('endPanel').classList.remove('hidden');
  const acc=total?Math.round(score/total*100):0;
  document.getElementById('endResult').innerHTML=`本次共 <b>${total}</b> 题，正确 <b>${score}</b> 题，正确率 <b>${acc}%</b>`;
  speak(`练习结束，共${total}题，正确${score}题`);

  const token=getToken();
  if(!token){document.getElementById('endResult').innerHTML+='<br><span class="small">（未填Token，记录仅本机保留）</span>'; return;}
  const today=new Date().toISOString().slice(0,10);
  const newRec={date:today, count:total, correct:score, total:TOTAL_Q, details:sessionDetails};
  try{
    let sha=null, existing=[];
    const d=await fetch(DATA_URL,{headers:{'Authorization':'token '+token}});
    if(d.ok){ const j=await d.json(); if(j.content){ existing=JSON.parse(safeAtob(j.content)); sha=j.sha; } }
    existing.push(newRec);
    const put=await fetch(DATA_URL,{method:'PUT', headers:{'Authorization':'token '+token, 'Content-Type':'application/json'}, body:JSON.stringify({message:'practice session', content:safeBtoa(JSON.stringify(existing,null,2)), sha})});
    if(!put.ok) throw new Error('上传失败');
    document.getElementById('endResult').innerHTML+='<br><span class="success">✅ 记录已同步到管理端</span>';
  }catch(e){document.getElementById('endResult').innerHTML+='<br><span class="danger">同步失败：'+e.message+'</span>';}
}

document.getElementById('tokenInput').value=getToken();
if(getToken()) loadConfigAndStart(); else document.getElementById('setupPanel').classList.remove('hidden');
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>老人认人练习</title>
<style>
  /* 样式保持你原有的大字体/大按钮风格，此处精简展示核心 */
  body{font-family:system-ui,sans-serif;margin:0;padding:0;background:#f5f7fa;color:#222;}
  .panel{padding:20px;display:none;} .panel.active{display:block;}
  #photoImg{display:block;margin:10px auto;max-width:80%;max-height:40vh;border-radius:12px;background:#ddd;}
  .option-btn{display:block;width:90%;margin:10px auto;padding:18px;font-size:28px;border-radius:14px;border:1px solid #ccc;background:#fff;}
  .option-btn.right{background:#d4edda;border-color:#28a745;}
  .option-btn.wrong{background:#f8d7da;border-color:#dc3545;}
  #nextBtn{display:none;width:90%;margin:20px auto;padding:18px;font-size:26px;border-radius:14px;background:#007bff;color:#fff;border:none;}
  .success{color:#28a745;} .danger{color:#dc3545;} .small{font-size:14px;color:#666;}
  #progressFill{height:12px;background:#007bff;border-radius:6px;width:0%;transition:.3s;}
</style>
</head>
<body>

<div id="homePanel" class="panel active">
  <h1 id="homeTitle">亲人认一认</h1>
  <p id="homeSub">加载中...</p>
  <p id="homeTip" class="small"></p>
  <button id="startBtn" style="width:90%;padding:20px;font-size:28px;border-radius:14px;background:#007bff;color:#fff;border:none;" onclick="startPractice()">开 始 练 习</button>
  <div style="margin-top:20px;"><button onclick="openSettings()">⚙️ 设置</button></div>
</div>

<div id="practicePanel" class="panel">
  <div id="progressFill"></div>
  <p id="progressText" class="small"></p>
  <img id="photoImg" alt="照片">
  <h2 id="questionText" style="text-align:center;font-size:32px;">这是谁？</h2>
  <p id="resultText" style="text-align:center;font-size:24px;"></p>
  <p id="revealText" style="text-align:center;font-size:22px;color:#555;"></p>
  <div id="optionsBox"></div>
  <button id="nextBtn" onclick="nextQuestion()">下 一 题</button>
</div>

<div id="endPanel" class="panel">
  <h1>练习结束</h1>
  <p id="endResult"></p>
  <p id="endEncourage"></p>
  <button style="width:90%;padding:18px;font-size:24px;border-radius:14px;background:#28a745;color:#fff;border:none;" onclick="goHome()">回 到 首 页</button>
</div>

<div id="settingsMask" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;padding:20px;overflow:auto;">
  <h2>设置</h2>
  <p>GitHub Token（用于同步成绩）：</p>
  <input id="tokenInput" style="width:90%;padding:10px;"><button onclick="saveToken()">保存</button>
  <p id="settingTip"></p>
  <hr>
  <div>每轮题数：
    <span id="segCount">
      <button onclick="setCount(5)">5 题</button>
      <button onclick="setCount(10)">10 题</button>
      <button onclick="setCount(15)">15 题</button>
    </span>
  </div>
  <div><button id="swSpeak" onclick="toggle('speak')">朗读</button>
       <button id="swSound" onclick="toggle('sound')">音效</button>
       <button id="swVibrate" onclick="toggle('vibrate')">震动</button>
       <button id="swBig" onclick="toggle('big')">大字</button>
       <button id="swAuto" onclick="toggle('auto')">自动下一题</button></div>
  <button onclick="closeSettings()">关闭</button>
</div>

<script>
/* ========== 基础配置（请按你实际仓库修改） ========== */
const REPO='你的用户名/你的仓库';
const BRANCH='main';
const CONFIG_URL=`https://raw.githubusercontent.com/${REPO}/${BRANCH}/config.json`;
const DATA_URL=`https://api.github.com/repos/${REPO}/contents/data.json`;
const PLACEHOLDER='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgZmlsbD0iI2RkZCIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjIwIiBmaWxsPSIjODg4Ij7lm77niYfliqDovb3lj5E8L3RleHQ+PC9zdmc+';

/* ========== 状态 ========== */
let PERSONS=[], PHOTOS={};
let settings={speak:true,sound:true,vibrate:true,big:true,auto:true,count:10};
let score=0, total=0, sessionDetails=[];
let questionPool=[], poolIndex=0;
let currentQ=null, answered=false, autoTimer=null;
let wrongList=[]; // 记录本轮错题
let isRetryRound=false; // 是否错题重练轮

/* ========== 工具 ========== */
const $=id=>document.getElementById(id);
function getToken(){return localStorage.getItem('gh_token')||'';}
function saveSettings(){localStorage.setItem('rr_settings',JSON.stringify(settings));}
function loadSettings(){try{settings=Object.assign(settings,JSON.parse(localStorage.getItem('rr_settings')||'{}'));}catch(e){}}
loadSettings();
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function safeAtob(s){return decodeURIComponent(escape(atob(s)));}
function safeBtoa(s){return btoa(unescape(encodeURIComponent(s)));}
function speak(text,rate){if(!settings.speak||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=rate||0.85;u.pitch=1.05;speechSynthesis.speak(u);}catch(e){}}
function beep(f,t,d){if(!settings.sound)return;try{const a=new (window.AudioContext||window.webkitAudioContext),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(0.2,a.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t+d);o.start();o.stop(a.currentTime+t+d+0.02);}catch(e){}}
function sfxRight(){beep(660,0,.16);beep(880,.16,.26);}
function sfxWrong(){beep(300,0,.3);}
function buzz(ms){if(!settings.vibrate)return;try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
function replay(){if(currentQ)speak('这是谁？');else speak('点中间那个大按钮，就可以开始练习');}

/* ========== 加载配置 & 照片（文件夹逻辑） ========== */
async function loadConfig(){
  try{
    const r=await fetch(CONFIG_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const cfg=await r.json();
    PERSONS=(cfg.persons||[]).map(p=>typeof p==='string'?{name:p,relation:'',hint:''}:{name:p.name||p,relation:p.relation||'',hint:p.hint||''}).filter(p=>p.name);
    PHOTOS=cfg.photos||{};
    // 若未配photos，尝试自动按文件夹匹配
    if(PERSONS.length&&Object.keys(PHOTOS).length===0){
      PERSONS.forEach(p=>{ PHOTOS[p.name]=`照片/${p.name}/1.jpg`; });
    }
    if(!PERSONS.length){$('homeTitle').innerText='还没有添加人物';$('startBtn').disabled=true;return;}
    $('homeTitle').innerText=(isRetryRound?'错题重练 ':'已准备好 ')+PERSONS.length+' 位亲人';
    $('homeSub').innerText='每次练 '+settings.count+' 题，慢慢来，不着急';
    $('homeTip').innerText=getToken()?'成绩会自动发给家人':'（未设置 Token，成绩只存在本机）';
    $('startBtn').disabled=false;
  }catch(e){
    $('homeTitle').innerText='照片加载失败';$('homeSub').innerText='请检查网络后重试（'+e.message+'）';
  }
}

/* ========== 题池：全员覆盖 + 随机补满 ========== */
function buildQuestionPool(list, roundCount){
  let base=[...list]; shuffle(base);
  let pool=[...base];
  while(pool.length<roundCount){ pool.push(base[Math.floor(Math.random()*base.length)]); }
  pool=pool.slice(0,roundCount); shuffle(pool);
  return pool;
}

/* ========== 练习流程 ========== */
function startPractice(){
  clearTimeout(autoTimer);
  if(!PERSONS.length){loadConfig();return;}
  score=0; total=0; sessionDetails=[]; wrongList=[];
  isRetryRound=false;
  questionPool=buildQuestionPool(PERSONS, settings.count);
  poolIndex=0;
  $('homePanel').classList.remove('active');
  $('endPanel').classList.remove('active');
  $('practicePanel').classList.add('active');
  nextQuestion();
}

function nextQuestion(){
  clearTimeout(autoTimer);
  if(poolIndex>=questionPool.length){
    // 一轮结束，判断是否错题重练
    if(!isRetryRound && wrongList.length>0){
      isRetryRound=true;
      score=0; total=0; sessionDetails=[];
      questionPool=buildQuestionPool(wrongList, Math.max(wrongList.length, settings.count));
      poolIndex=0;
      loadConfig(); // 更新标题
      setTimeout(()=>{ $('practicePanel').classList.add('active'); nextQuestion(); },500);
      return;
    }
    finishPractice();
    return;
  }
  answered=false;
  currentQ=questionPool[poolIndex];
  const img=$('photoImg');
  img.onerror=()=>{img.onerror=null;img.src=PLACEHOLDER;};
  img.src=PHOTOS[currentQ.name]||PLACEHOLDER;
  $('questionText').innerText='这是谁？';
  $('resultText').innerText='';
  $('revealText').innerText='';
  $('nextBtn').style.display='none';
  $('nextBtn').disabled=false;

  // 选项
  const pool=PERSONS.filter(p=>p.name!==currentQ.name);
  const others=pool.filter(p=>p.relation!==currentQ.relation);
  const rest=pool.filter(p=>p.relation===currentQ.relation);
  shuffle(others);shuffle(rest);
  let opts=[currentQ,...others,...rest].slice(0,Math.min(4,PERSONS.length));
  shuffle(opts);
  const box=$('optionsBox'); box.innerHTML='';
  opts.forEach(p=>{
    const b=document.createElement('button');
    b.className='option-btn';
    b.textContent=p.name;
    b.onclick=()=>answer(p,b);
    box.appendChild(b);
  });
  updateProgress();
  speak('这是谁？');
}

function answer(picked,btn){
  if(answered)return;
  answered=true;
  clearTimeout(autoTimer);
  const correct=picked.name===currentQ.name;
  total++; if(correct)score++;
  sessionDetails.push({expected:currentQ.name,actual:picked.name,correct,at:new Date().toISOString()});
  [...$('optionsBox').children].forEach(b=>{
    b.disabled=true;
    if(b.textContent===currentQ.name)b.classList.add('right');
  });
  if(!correct){btn.classList.add('wrong'); wrongList.push(currentQ);}
  $('revealText').innerText=currentQ.relation?(currentQ.name+'（'+currentQ.relation+'）'):currentQ.name;

  if(correct){
    $('resultText').innerHTML='<span class="success">✅ 答对了！</span>';
    sfxRight();buzz(60);speak('答对了，'+currentQ.name);
  }else{
    const hint=currentQ.hint?('，'+currentQ.hint):'';
    $('resultText').innerHTML='<span class="danger">❌ 不对</span>';
    sfxWrong();buzz([120,80,120]);
    speak('不对，这是'+currentQ.name+(currentQ.relation?('，你的'+currentQ.relation):'')+hint,0.8);
  }
  updateProgress();
  poolIndex++;

  // 无论对错，3秒后自动下一题（若开启auto）；否则显示按钮
  if(settings.auto){
    let left=3, nb=$('nextBtn');
    nb.style.display='block';
    const tick=()=>{
      if(left<=0){nb.innerText='下 一 题';nextQuestion();return;}
      nb.innerText='下 一 题（'+left+'）';
      left--;autoTimer=setTimeout(tick,1000);
    };
    tick();
  }else{
    $('nextBtn').style.display='block';
  }
}

function updateProgress(){
  const n=questionPool.length||settings.count;
  $('progressFill').style.width=Math.min(100,(poolIndex/n)*100)+'%';
  $('progressText').innerText='第 '+Math.min(poolIndex+1,n)+' 题 / 共 '+n+' 题　答对 '+score+' 题'+(isRetryRound?'（错题重练）':'');
}

/* ========== 结束 ========== */
function goHome(){
  clearTimeout(autoTimer);
  $('practicePanel').classList.remove('active');
  $('endPanel').classList.remove('active');
  $('homePanel').classList.add('active');
  isRetryRound=false;
  loadConfig();
}

async function finishPractice(){
  clearTimeout(autoTimer);
  $('practicePanel').classList.remove('active');
  $('endPanel').classList.add('active');
  const acc=total?Math.round(score/total*100):0;
  $('endResult').innerHTML='本次共 <b>'+total+'</b> 题，答对 <b>'+score+'</b> 题<br>正确率 <b style="font-size:1.4em">'+acc+'%</b>';
  $('endEncourage').innerText=acc>=90?'太棒了，记得很牢！':acc>=60?'不错，再练几遍就更熟啦':'慢慢来，多练几次就会记住的';
  if(acc>=90)sfxRight();else sfxWrong();
  buzz(acc>=90?60:[100,80,100]);
  speak('练习结束，一共'+total+'题，答对'+score+'题。'+$('endEncourage').innerText,0.8);
  // 历史与上传（保留原有逻辑）
  try{const hist=JSON.parse(localStorage.getItem('rr_history')||'[]');hist.push({date:new Date().toISOString().slice(0,10),total,correct:score,details:sessionDetails});localStorage.setItem('rr_history',JSON.stringify(hist.slice(-200)));}catch(e){}
  await uploadRecord({date:new Date().toISOString().slice(0,10),count:total,correct:score,total,accuracy:acc,details:sessionDetails,isRetry:isRetryRound});
}

async function uploadRecord(rec){
  const token=getToken();
  if(!token){try{const q=JSON.parse(localStorage.getItem('rr_pending')||'[]');q.push(rec);localStorage.setItem('rr_pending',JSON.stringify(q));}catch(e){}$('endEncourage').innerHTML+='<br><span class="small">（成绩已存在本机；补填 Token 后会自动上传）</span>';return;}
  $('endEncourage').innerHTML+='<br><span class="small" id="upTip">正在保存成绩…</span>';
  try{
    let sha=null,list=[];
    const r=await fetch(DATA_URL+'?t='+Date.now(),{headers:{Authorization:'token '+token}});
    if(r.status===404)list=[];else if(!r.ok)throw new Error('读取失败 '+r.status);else{const d=await r.json();if(d.content)try{list=JSON.parse(safeAtob(d.content));}catch(e){list=[];}sha=d.sha||null;}
    if(!Array.isArray(list))list=[];
    const pend=JSON.parse(localStorage.getItem('rr_pending')||'[]');
    list=list.concat(pend,[rec]);localStorage.removeItem('rr_pending');
    const body={message:'practice session '+new Date().toISOString(),content:safeBtoa(JSON.stringify(list,null,2))};
    if(sha)body.sha=sha;
    const up=await fetch(DATA_URL,{method:'PUT',headers:{Authorization:'token '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!up.ok)throw new Error('上传失败 '+up.status);
    const tip=$('upTip');if(tip)tip.innerHTML='<span class="success">✅ 成绩已发给家人</span>';
  }catch(e){
    try{const q=JSON.parse(localStorage.getItem('rr_pending')||'[]');q.push(rec);localStorage.setItem('rr_pending',JSON.stringify(q));}catch(_){}
    const tip=$('upTip');if(tip)tip.innerHTML='<span class="danger">保存失败（'+e.message+'），成绩已留在本机</span>';
  }
}
async function flushPending(){const q=JSON.parse(localStorage.getItem('rr_pending')||'[]');if(!q.length||!getToken())return;localStorage.removeItem('rr_pending');for(const rec of q)await uploadRecord(rec);}

/* ========== 设置面板 ========== */
function openSettings(){$('tokenInput').value=getToken();applySettings();$('settingsMask').style.display='block';$('settingTip').innerText='';}
function closeSettings(){$('settingsMask').style.display='none';}
function toggle(k){settings[k]=!settings[k];if(k==='speak'&&settings.speak)speak('已打开朗读',1);saveSettings();applySettings();}
function setCount(n){settings.count=n;saveSettings();applySettings();$('homeSub').innerText='每次练 '+n+' 题，慢慢来，不着急';}
function applySettings(){
  document.body.classList.toggle('big-font',settings.big);
  $('swSpeak').classList.toggle('on',settings.speak);
  $('swSound').classList.toggle('on',settings.sound);
  $('swVibrate').classList.toggle('on',settings.vibrate);
  $('swBig').classList.toggle('on',settings.big);
  $('swAuto').classList.toggle('on',settings.auto);
  [...$('segCount').children].forEach(b=>b.classList.toggle('on',b.textContent.trim()===settings.count+' 题'));
}

/* ========== 初始化 ========== */
$('photoImg').onclick=replay;$('questionText').onclick=replay;
document.addEventListener('touchstart',function once(){document.removeEventListener('touchstart',once);},{passive:true});
applySettings();loadConfig();flushPending();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>认人练习</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
h1 { color: #2196F3; margin-bottom: 10px; font-size: 24px; }
#gameArea { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); max-width: 500px; width: 100%; text-align: center; }
.photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
.photo-cell { border: 3px solid #e0e0e0; border-radius: 8px; overflow: hidden; cursor: pointer; transition: border-color 0.2s; aspect-ratio: 1; }
.photo-cell:hover { border-color: #2196F3; }
.photo-cell.correct { border-color: #4CAF50; }
.photo-cell.wrong { border-color: #f44336; }
.photo-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.options { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 15px 0; }
.option-btn { padding: 10px 18px; border: 2px solid #2196F3; border-radius: 8px; background: white; color: #2196F3; font-size: 16px; cursor: pointer; }
.option-btn:hover { background: #2196F3; color: white; }
.option-btn.correct { background: #4CAF50; border-color: #4CAF50; color: white; }
.option-btn.wrong { background: #f44336; border-color: #f44336; color: white; }
.option-btn:disabled { cursor: not-allowed; opacity: 0.6; }
#status { margin: 10px 0; font-size: 16px; color: #666; }
#startBtn { padding: 12px 30px; font-size: 18px; border: none; border-radius: 8px; background: #2196F3; color: white; cursor: pointer; margin-top: 10px; }
#startBtn:hover { background: #1976D2; }
.loading { color: #999; font-size: 14px; margin: 20px 0; }
.error { color: #f44336; font-size: 14px; margin: 20px 0; }
</style>
</head>
<body>
<h1>👴 认人练习</h1>
<div id="gameArea">
  <div id="status">正在加载人物数据...</div>
  <div class="photo-grid" id="photoGrid" style="display:none;"></div>
  <div class="options" id="options" style="display:none;"></div>
  <button id="startBtn" onclick="startGame()" style="display:none;">开始练习</button>
</div>

<script>
// ================= 配置 =================
const REPO_OWNER = 'Kenny-17-Z';
const REPO_NAME  = 'lnrrzza';
const BRANCH     = 'main';
const CONFIG_FILE = 'config.json';
const DATA_FILE  = 'data.json';

let configData = null;       // 从仓库拉取的 config.json
let currentQuestion = null;  // 当前题目
let score = 0;
let totalQuestions = 0;
const QUESTIONS_PER_ROUND = 6;

// ================= Token =================
function getToken() {
  return localStorage.getItem('ghToken');
}

// ================= GitHub API =================
async function ghGet(path) {
  const token = getToken();
  const headers = token ? { 'Authorization': `token ${token}` } : {};
  const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}?ref=${BRANCH}`, { headers });
  if (!res.ok) throw new Error(`GET ${path}: ${res.status}`);
  return res.json();
}

async function ghPut(path, contentB64, sha, message) {
  const token = getToken();
  if (!token) throw new Error('未配置 Token');
  const body = { message, content: contentB64, branch: BRANCH };
  if (sha) body.sha = sha;
  const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
    method: 'PUT',
    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) { const j = await res.json(); throw new Error(`PUT ${path}: ${j.message}`); }
  return res.json();
}

function base64ToText(b64) {
  return decodeURIComponent(escape(atob(b64)));
}

// ================= 加载配置 =================
async function loadConfig() {
  const status = document.getElementById('status');
  try {
    const file = await ghGet(CONFIG_FILE);
    configData = JSON.parse(base64ToText(file.content));
    status.innerText = `已加载 ${configData.photos ? configData.photos.length : 0} 张照片，点击开始练习`;
    document.getElementById('startBtn').style.display = 'inline-block';
  } catch (e) {
    status.innerHTML = `<span class="error">加载失败: ${e.message}<br>请确认已在管理端配置 Token</span>`;
  }
}

// ================= 获取图片 data URL =================
async function getImageDataUrl(path) {
  const token = getToken();
  const headers = token ? { 'Authorization': `token ${token}` } : {};
  const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}?ref=${BRANCH}`, { headers });
  if (!res.ok) throw new Error(`加载图片失败: ${path}`);
  const data = await res.json();
  return `data:image/${getExt(path)};base64,${data.content}`;
}

function getExt(path) {
  const e = path.split('.').pop().toLowerCase();
  return e === 'jpg' || e === 'jpeg' ? 'jpeg' : e === 'png' ? 'png' : 'jpeg';
}

// ================= 游戏逻辑 =================
function getUniquePersons() {
  if (!configData || !configData.photos) return [];
  const map = {};
  configData.photos.forEach(p => {
    if (!map[p.name]) map[p.name] = [];
    map[p.name].push(p);
  });
  return Object.keys(map).map(name => ({ name, photos: map[name] }));
}

function pickRandom(arr, n) {
  const a = [...arr];
  const res = [];
  for (let i = 0; i < Math.min(n, a.length); i++) {
    const idx = Math.floor(Math.random() * a.length);
    res.push(a[idx]);
    a.splice(idx, 1);
  }
  return res;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

async function startGame() {
  const persons = getUniquePersons();
  if (persons.length < 2) {
    alert('至少需要2个人物才能开始练习');
    return;
  }

  score = 0;
  totalQuestions = 0;
  document.getElementById('startBtn').style.display = 'none';
  await nextQuestion();
}

async function nextQuestion() {
  const status = document.getElementById('status');
  const grid = document.getElementById('photoGrid');
  const optionsDiv = document.getElementById('options');

  if (totalQuestions >= QUESTIONS_PER_ROUND) {
    status.innerText = `练习完成！得分 ${score}/${QUESTIONS_PER_ROUND}`;
    grid.style.display = 'none';
    optionsDiv.style.display = 'none';
    document.getElementById('startBtn').style.display = 'inline-block';
    document.getElementById('startBtn').innerText = '再来一次';
    // 自动上传记录
    await uploadRecord();
    return;
  }

  const persons = getUniquePersons();
  const correctPerson = persons[Math.floor(Math.random() * persons.length)];
  const wrongPersons = pickRandom(persons.filter(p => p.name !== correctPerson.name), 3);
  const allOptions = shuffle([correctPerson, ...wrongPersons]);

  status.innerText = `第 ${totalQuestions + 1}/${QUESTIONS_PER_ROUND} 题 — 请找出：${correctPerson.name}`;
  grid.innerHTML = '<div class="loading">加载图片中...</div>';
  grid.style.display = 'grid';
  optionsDiv.style.display = 'none';

  // 从正确人物的照片池中随机选一张
  const photo = correctPerson.photos[Math.floor(Math.random() * correctPerson.photos.length)];

  try {
    const imgUrl = await getImageDataUrl(photo.url);
    grid.innerHTML = `<div class="photo-cell"><img src="${imgUrl}" alt="${correctPerson.name}"></div>`;
  } catch(e) {
    grid.innerHTML = `<div class="error">图片加载失败</div>`;
    return;
  }

  // 生成选项按钮
  optionsDiv.innerHTML = '';
  allOptions.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerText = opt.name;
    btn.onclick = () => handleAnswer(opt.name, correctPerson.name, btn, allOptions.map(o => o.name));
    optionsDiv.appendChild(btn);
  });
  optionsDiv.style.display = 'flex';
}

function handleAnswer(selected, correct, btn, allNames) {
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach(b => b.disabled = true);

  totalQuestions++;
  currentQuestion = { name: correct, selected, correct: selected === correct };

  if (selected === correct) {
    btn.classList.add('correct');
    score++;
  } else {
    btn.classList.add('wrong');
    buttons.forEach(b => {
      if (b.innerText === correct) b.classList.add('correct');
    });
  }

  setTimeout(() => nextQuestion(), 1200);
}

// ================= 上传记录 =================
async function uploadRecord() {
  const token = getToken();
  if (!token) return; // 无 Token 不上传

  const today = new Date();
  const dateStr = today.toISOString().split('T')[0];

  // 读取当前 data.json
  let sha = null;
  let records = [];
  try {
    const file = await ghGet(DATA_FILE);
    sha = file.sha;
    records = JSON.parse(base64ToText(file.content));
    if (!Array.isArray(records)) records = records.records || [];
  } catch(e) {
    // 文件不存在，从头开始
  }

  // 计算当天已有几条记录
  const todayCount = records.filter(r => r.date === dateStr).length + 1;

  const newRecord = {
    date: dateStr,
    count: todayCount,
    total: QUESTIONS_PER_ROUND,
    correct: score,
    details: currentQuestion ? [currentQuestion] : []
  };

  records.push(newRecord);

  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(records, null, 2))));
  try {
    await ghPut(DATA_FILE, b64, sha, `add record ${dateStr} #${todayCount}`);
    document.getElementById('status').innerText += ' ✅ 记录已保存';
  } catch(e) {
    document.getElementById('status').innerText += ' ⚠️ 保存失败';
  }
}

// ================= 初始化 =================
loadConfig();
</script>
</body>
</html>
